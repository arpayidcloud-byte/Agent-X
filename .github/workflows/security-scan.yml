name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @agent-xai/persistence db:generate

      - name: Dependency Audit
        run: pnpm audit --audit-level=critical
        continue-on-error: true

      - name: Check for Secrets (Basic)
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -r --include="*.ts" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            -E "(api_key|password|secret)\s*[=:]\s*['\"][a-zA-Z0-9_-]{15,}['\"]" . \
            | grep -v ".env" | grep -v test; then
            echo "::warning::Potential hardcoded secrets detected, please review!"
          fi
          echo "✅ Secret scan completed"
