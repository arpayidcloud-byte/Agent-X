apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentx-db-backup
  namespace: agentx
  labels:
    app: agentx-db-backup
    component: backup
spec:
  schedule: '0 2 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/agentx_${TIMESTAMP}.sql.gz"
                  TEMP_FILE="${BACKUP_FILE}.partial"
                  echo "Starting backup: ${BACKUP_FILE}"
                  rm -f "$TEMP_FILE"

                  # PostgreSQL libpq accepts the URL, but pg_dump rejects
                  # Prisma's `schema` query parameter. Remove only that
                  # parameter without exposing credentials in logs.
                  CLEAN_DATABASE_URL=$(printf '%s' "$DATABASE_URL" | sed -E 's/([?&])schema=[^&]*&?/\1/g; s/\?&/?/; s/[?&]$//')
                  test -n "$CLEAN_DATABASE_URL"

                  pg_dump --no-owner --no-privileges "$CLEAN_DATABASE_URL" > "${TEMP_FILE}.sql"
                  test -s "${TEMP_FILE}.sql"
                  gzip -c "${TEMP_FILE}.sql" > "$TEMP_FILE"
                  rm -f "${TEMP_FILE}.sql"
                  gzip -t "$TEMP_FILE"
                  test "$(gzip -dc "$TEMP_FILE" | wc -c)" -gt 0
                  mv "$TEMP_FILE" "$BACKUP_FILE"
                  echo "Backup completed: ${BACKUP_FILE}"

                  # Retention: remove backups older than 30 days.
                  find /backups -name 'agentx_*.sql.gz' -mtime +30 -delete
                  echo "Retention cleanup completed (30d)"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: agentx-db
                      key: url
                      optional: false
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
