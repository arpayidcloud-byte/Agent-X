apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentx-db-backup
  namespace: agentx
  labels:
    app: agentx-db-backup
    component: backup
spec:
  schedule: '0 2 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/agentx_${TIMESTAMP}.sql.gz"
                  echo "Starting backup: ${BACKUP_FILE}"
                  pg_dump "$DATABASE_URL" | gzip > "$BACKUP_FILE"
                  echo "Backup completed: ${BACKUP_FILE}"
                  # Retention: remove backups older than 30 days
                  find /backups -name 'agentx_*.sql.gz' -mtime +30 -delete
                  echo "Retention cleanup completed (30d)"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: agentx-db
                      key: url
                      optional: false
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
