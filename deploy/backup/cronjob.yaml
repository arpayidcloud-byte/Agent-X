apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentx-db-backup
  namespace: agentx
  labels:
    app: agentx
    component: backup
spec:
  schedule: '0 2 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  FN=/backup/agentx-$(date +%F).sql.gz
                  pg_dump "$DATABASE_URL" | gzip > $FN
                  echo "Backup saved: $FN ($(ls -lh $FN | awk '{print $5}'))"
                  find /backup -name "*.sql.gz" -mtime +30 -delete
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: agentx-secrets
                      key: database-url
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup-pvc
