apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "agentx.fullname" . }}-web"
  labels:
    app.kubernetes.io/name: "{{ include "agentx.fullname" . }}"
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ include "agentx.fullname" . }}"
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ include "agentx.fullname" . }}"
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
