apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agentx.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "agentx.fullname" . }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage.size }}
