apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentx.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "agentx.fullname" . }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "agentx.fullname" . }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
