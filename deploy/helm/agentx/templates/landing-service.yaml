apiVersion: v1
kind: Service
metadata:
  name: "{{ include "agentx.fullname" . }}-landing"
  labels:
    app.kubernetes.io/name: "{{ include "agentx.fullname" . }}"
    app.kubernetes.io/component: landing
spec:
  type: {{ .Values.landing.service.type }}
  selector:
    app.kubernetes.io/name: "{{ include "agentx.fullname" . }}"
    app.kubernetes.io/component: landing
  ports:
    - name: http
      port: {{ .Values.landing.service.port }}
      targetPort: http
      {{- if and (eq .Values.landing.service.type "NodePort") .Values.landing.service.nodePort }}
      nodePort: {{ .Values.landing.service.nodePort }}
      {{- end }}
