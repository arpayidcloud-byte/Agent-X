apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentx.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "agentx.fullname" . }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agentx.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agentx.fullname" . }}
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: prisma-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
          command: ["sh", "-c"]
          args:
            - >-
              npx prisma migrate deploy
              --schema packages/shared/persistence/prisma/schema.prisma
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: ENABLE_MOCK_PROVIDER
              value: {{ .Values.env.ENABLE_MOCK_PROVIDER | quote }}
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.env.AUTH_ENABLED | quote }}
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.existingSecret }}
                  key: ADMIN_EMAILS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.existingSecret }}
                  key: JWT_SECRET
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
