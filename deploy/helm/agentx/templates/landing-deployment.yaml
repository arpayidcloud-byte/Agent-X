apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "agentx.fullname" . }}-landing"
  labels:
    app.kubernetes.io/name: "{{ include "agentx.fullname" . }}"
    app.kubernetes.io/component: landing
spec:
  replicas: {{ .Values.landing.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ include "agentx.fullname" . }}"
      app.kubernetes.io/component: landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ include "agentx.fullname" . }}"
        app.kubernetes.io/component: landing
    spec:
      containers:
        - name: landing
          image: "{{ .Values.landing.image.repository }}:{{ .Values.landing.image.tag }}"
          imagePullPolicy: {{ .Values.landing.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.landing.resources | nindent 12 }}
