# Agent-X Helm chart default values.
# Deploy: helm install agentx deploy/helm/agentx -n agentx --create-namespace

replicaCount: 1

image:
  repository: agentx-api
  tag: dev
  # IfNotPresent is REQUIRED for locally-imported images (k3s containerd).
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 4000
  # NodePort exposed on the cluster node for host-side verification.
  nodePort: 30400

env:
  # Dev-mode mock providers so the API works without external API keys.
  ENABLE_MOCK_PROVIDER: 'true'
  PORT: '4000'
  # Auth + persistence (Phase 3): enable admin guard & point at the in-cluster postgres.
  AUTH_ENABLED: 'true'
  DATABASE_URL: 'postgresql://agentx:agentx@agentx-api-postgres:5432/agentx?schema=public'
  # Secrets are NOT stored in git. Create the secret first, then deploy:
  #   kubectl create secret generic agentx-secrets -n agentx \
  #     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
  #     --from-literal=ADMIN_EMAILS='admin@agentx.dev'
  # ADMIN_EMAILS: comma-separated admin emails (lowercase); JWT_SECRET: signing key.
  existingSecret: agentx-secrets

# In-cluster PostgreSQL (single node demo).
postgres:
  image: postgres:16-alpine
  pullPolicy: IfNotPresent
  port: 5432
  user: agentx
  password: agentx
  database: agentx
  storage:
    size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  path: /health
  port: 4000

readinessProbe:
  path: /health
  port: 4000

# Web dashboard (Next.js standalone).
web:
  replicaCount: 1
  image:
    repository: agentx-web
    tag: dev
    # IfNotPresent is REQUIRED for locally-imported images (k3s containerd).
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    # NodePort for the web dashboard on the cluster node.
    nodePort: 30500
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
