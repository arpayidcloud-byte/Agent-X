apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: agentx
data:
  alertmanager.yml: |
    route:
      receiver: 'agentx-webhook'
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: 'agentx-webhook'
        webhook_configs:
          # GANTI URL ini dengan webhook Slack/Telegram asli, lalu:
          #   kubectl create configmap alertmanager-config -n agentx \
          #     --from-file=deploy/monitoring/alertmanager-config.yaml --dry-run=client -o yaml | kubectl apply -f -
          #   kubectl rollout restart deployment agentx-alertmanager -n agentx
          - url: 'https://example.com/placeholder-webhook'
            send_resolved: true
