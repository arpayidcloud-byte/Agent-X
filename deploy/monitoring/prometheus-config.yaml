apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agentx
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['agentx-alertmanager:9093']
    scrape_configs:
      - job_name: 'agentx-api'
        metrics_path: /metrics
        static_configs:
          - targets: ['agentx-api:4000']
            labels:
              app: agentx-api
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
  rules.yml: |
    groups:
      - name: agentx-llm
        rules:
          - alert: LLMHighErrorRate
            expr: |
              sum(rate(llm_errors_total[5m])) by (provider)
              / clamp_min(sum(rate(llm_requests_total[5m])) by (provider), 1)
              > 0.10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "LLM error rate >10% (provider {{ $labels.provider }})"
              description: "Provider {{ $labels.provider }} error rate is {{ $value | humanizePercentage }} over 5m"
          - alert: LLMHighLatency
            expr: |
              histogram_quantile(0.95, sum(rate(llm_request_latency_seconds_bucket[5m])) by (le))
              > 30
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "LLM P95 latency > 30s"
              description: "P95 LLM request latency is {{ $value }}s over 10m"
          - alert: LLMCostSpike
            expr: |
              increase(llm_cost_usd_total[1h]) > 5
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "LLM cost spike > $5 in 1h"
              description: "LLM cost increased by ${{ $value }} in the last hour"
      - name: agentx-http
        rules:
          - alert: HTTPHigh5xxRate
            expr: |
              sum(rate(http_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total[5m])), 1)
              > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HTTP 5xx rate > 5%"
              description: "5xx rate is {{ $value | humanizePercentage }} over 5m"
          - alert: APIInstanceDown
            expr: up{job="agentx-api"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "agentx-api is down"
              description: "Prometheus cannot scrape agentx-api for over 2 minutes"
      - name: agentx-providers
        rules:
          - alert: ProviderUnhealthy
            expr: llm_provider_health == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "LLM provider {{ $labels.provider }} unhealthy"
              description: "Provider {{ $labels.provider }} has been unhealthy for over 10m"
